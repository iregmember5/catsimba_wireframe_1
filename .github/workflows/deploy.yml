name: Validate and deploy Cashbasis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cashbasis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/build.py

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://cashbasis.catsimba.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/build.py
      - name: Upload and activate release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}" "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}" "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          VPS_PORT=${VPS_PORT:-22}
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/cashbasis_key ~/.ssh/known_hosts' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cashbasis_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cashbasis_key ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/cashbasis_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="$VPS_USER@$VPS_HOST"
          ssh "${ssh_opts[@]}" "$target" "mkdir /var/www/cashbasis/releases/$release"
          tar -C dist -czf - . | ssh "${ssh_opts[@]}" "$target" "tar -xzf - -C /var/www/cashbasis/releases/$release && chmod -R a+rX /var/www/cashbasis/releases/$release"
          ssh "${ssh_opts[@]}" "$target" bash -s -- "$release" <<'REMOTE'
          set -euo pipefail
          base=/var/www/cashbasis
          release=$1
          test -s "$base/releases/$release/index.html"
          # Check the exact permission before changing the active release.
          sudo -n -l /usr/local/sbin/cashbasis-restart-apache
          previous=$(readlink "$base/current" || true)
          ln -s "$base/releases/$release" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"
          if ! sudo -n /usr/local/sbin/cashbasis-restart-apache; then
            if [ -n "$previous" ]; then
              ln -s "$previous" "$base/current.rollback"
              mv -Tf "$base/current.rollback" "$base/current"
            else
              rm "$base/current"
            fi
            echo 'Apache restart failed; release deactivated.' >&2
            exit 1
          fi
          if ! curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --resolve cashbasis.catsimba.com:443:127.0.0.1 \
              https://cashbasis.catsimba.com/ | cmp -s - "$base/releases/$release/index.html"; then
            if [ -n "$previous" ]; then
              ln -s "$previous" "$base/current.rollback"
              mv -Tf "$base/current.rollback" "$base/current"
            else
              rm "$base/current"
            fi
            echo 'HTTPS content check failed; release deactivated.' >&2
            exit 1
          fi
          REMOTE
      - name: Check public HTTPS and DNS
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 https://cashbasis.catsimba.com/ | cmp -s - dist/index.html
