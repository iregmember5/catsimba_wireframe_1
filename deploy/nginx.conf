# Ubuntu/Debian Nginx server block. Install only after checking existing sites.
server {
    listen 80;
    server_name cashbasis.catsimba.com;
    root /var/www/cashbasis/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # This is a public prototype, not a production registration/payment service.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
