# Apache 2.4 on Ubuntu/Debian. Enable mod_headers before enabling this site.
<VirtualHost *:80>
    ServerName cashbasis.catsimba.com
    DocumentRoot /var/www/cashbasis/current
    DirectoryIndex index.html

    <Directory /var/www/cashbasis>
        # Follow the atomic release symlink; disable listings, CGI and SSI.
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Cache-Control "no-cache"

    ErrorLog ${APACHE_LOG_DIR}/cashbasis-error.log
    CustomLog ${APACHE_LOG_DIR}/cashbasis-access.log combined
</VirtualHost>
